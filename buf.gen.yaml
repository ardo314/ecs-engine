# For details on buf.gen.yaml configuration, visit https://buf.build/docs/configuration/v2/buf-gen-yaml
version: v2
clean: true
plugins:
  - remote: buf.build/protocolbuffers/csharp:v29.3
    out: proto/gen/csharp/src
  - remote: buf.build/bufbuild/es:v2.2.3
    out: proto/gen/ts/src
    opt:
      - target=ts
      - import_extension=js
inputs:
  - directory: proto
