syntax = "proto3";

package testing.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Types whose only purpose is to pin down the schema hash across languages.
//
// Each one sits on a place where protobuf runtimes disagree about how to model a
// schema. The descriptor has exactly one answer for all of them, which is why the
// canonical form is defined over FileDescriptorProto rather than over any
// runtime's reflection API. See protocol/SPEC.md.

// Maps. C# exposes a synthetic MapEntry message and reports the field as
// repeated; protobuf-es hides the entry behind `fieldKind: "map"`; Python
// surfaces it with the `map_entry` option set. In the descriptor it is simply a
// repeated message field pointing at a nested type.
message ConformanceMaps {
  map<string, int32> counts = 1;
  map<int64, ConformanceLeaf> leaves = 2;
}

// Explicit versus implicit presence. `optional` in proto3 generates a synthetic
// oneof that is not part of the type's shape, but the presence it implies is.
message ConformancePresence {
  string implicit_field = 1;
  optional string explicit_field = 2;
  repeated string repeated_field = 3;
}

// A real oneof, which is part of the shape.
message ConformanceOneof {
  oneof choice {
    int32 number = 1;
    string text = 2;
    ConformanceLeaf leaf = 3;
  }
  string outside = 4;
}

message ConformanceEnums {
  ConformanceColour colour = 1;
  repeated ConformanceColour palette = 2;
}

// Deliberately non-contiguous, to prove values are ordered by number.
enum ConformanceColour {
  CONFORMANCE_COLOUR_UNSPECIFIED = 0;
  CONFORMANCE_COLOUR_RED = 7;
  CONFORMANCE_COLOUR_GREEN = 3;
}

// Nested and mutually recursive references. The reference closure is a set, not
// a tree, so an implementation that walks it naively will not terminate.
message ConformanceRecursive {
  ConformanceRecursive next = 1;
  repeated ConformanceRecursive children = 2;
  Inner inner = 3;

  message Inner {
    ConformanceRecursive back = 1;
  }
}

message ConformanceLeaf {
  bytes blob = 1;
}

// Well-known types: every language ships them and none generates them here.
// Struct pulls in a map, a oneof and mutual recursion through Value and
// ListValue in a single case.
message ConformanceWellKnown {
  google.protobuf.Struct settings = 1;
  google.protobuf.Timestamp at = 2;
}

// Every scalar type, so the whole type-name table is covered.
message ConformanceScalars {
  double f_double = 1;
  float f_float = 2;
  int64 f_int64 = 3;
  uint64 f_uint64 = 4;
  int32 f_int32 = 5;
  fixed64 f_fixed64 = 6;
  fixed32 f_fixed32 = 7;
  bool f_bool = 8;
  string f_string = 9;
  bytes f_bytes = 12;
  uint32 f_uint32 = 13;
  sfixed32 f_sfixed32 = 15;
  sfixed64 f_sfixed64 = 16;
  sint32 f_sint32 = 17;
  sint64 f_sint64 = 18;
}

// Declared out of field-number order, to prove the rendering sorts.
message ConformanceOrdering {
  string c = 30;
  string a = 1;
  string b = 20;
}

// Same shape as ConformanceLeaf, different name: identity is anchored to the
// root type, not only to its fields.
message ConformanceLeafTwin {
  bytes blob = 1;
}
