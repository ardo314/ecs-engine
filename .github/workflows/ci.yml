name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-engine:
    runs-on: ubuntu-latest

    services:
      nats:
        image: nats:2.10
        ports:
          - 4222:4222

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: |
          dotnet restore engine/Engine.sln
          dotnet restore clients/csharp/CSharp.sln

      - name: Build
        run: |
          dotnet build engine/Engine.sln --no-restore
          dotnet build clients/csharp/CSharp.sln --no-restore

      - name: Unit tests
        run: dotnet test engine/Engine.sln --no-build --verbosity normal --filter "Category=Unit"

      - name: Integration tests (Engine)
        run: dotnet test engine/Engine.Tests --no-build --verbosity normal --filter "Category=Integration"
        env:
          NATS_URL: nats://localhost:4222

      - name: Start coordinator for client integration tests
        run: |
          dotnet run --project engine/Engine --no-build &
          sleep 3
        env:
          NATS_URL: nats://localhost:4222

      - name: Integration tests (Client)
        run: dotnet test clients/csharp/Client.Tests --no-build --verbosity normal --filter "Category=Integration"
        env:
          NATS_URL: nats://localhost:4222

  build-editor-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build editor/backend/EditorBackend.sln

  build-editor-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci
        working-directory: editor/frontend

      - name: Build
        run: npm run build
        working-directory: editor/frontend

  test-nova-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Test
        run: dotnet test deployments/nova/NovaInstaller.sln --verbosity normal

  publish-images:
    needs: [test-engine, build-editor-backend, build-editor-frontend, test-nova-installer]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: engine
            context: ./engine
            dockerfile: ./engine/Dockerfile
          - name: movement-system
            context: .
            dockerfile: ./examples/MovementSystem/Dockerfile
          - name: nova-systems
            context: .
            dockerfile: ./examples/Nova.Systems/Dockerfile
          - name: editor-backend
            context: .
            dockerfile: ./editor/backend/Dockerfile
          - name: editor-frontend
            context: ./editor/frontend
            dockerfile: ./editor/frontend/Dockerfile
          - name: nova-installer
            context: ./deployments/nova
            dockerfile: ./deployments/nova/Dockerfile
          - name: nova-nats
            context: ./deployments/nova/nats
            dockerfile: ./deployments/nova/nats/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
