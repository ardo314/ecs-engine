services:
  nats:
    image: nats:2.10
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

  engine:
    build:
      context: ./engine
    depends_on:
      - nats
    environment:
      NATS_URL: nats://nats:4222
    develop:
      watch:
        - action: rebuild
          path: ./engine/Engine

  movement-system:
    build:
      context: .
      dockerfile: examples/MovementSystem/Dockerfile
    depends_on:
      - nats
      - engine
    environment:
      NATS_URL: nats://nats:4222
    develop:
      watch:
        - action: rebuild
          path: ./examples/MovementSystem

  editor-backend:
    build:
      context: .
      dockerfile: editor/backend/Dockerfile
    depends_on:
      - nats
    ports:
      - "5000:5000"
    environment:
      NATS_URL: nats://nats:4222
      BASE_PATH: ${EDITOR_BACKEND_BASE_PATH:-/}
    develop:
      watch:
        - action: rebuild
          path: ./editor/backend/EditorBackend
        - action: rebuild
          path: ./clients/csharp/Client

  editor-frontend:
    build:
      context: ./editor/frontend
      args:
        BASE_PATH: ${EDITOR_FRONTEND_BASE_PATH:-/}
        EDITOR_BACKEND_URL: ${EDITOR_BACKEND_URL:-http://localhost:5000}
    ports:
      - "3000:80"
    environment:
      BASE_PATH: ${EDITOR_FRONTEND_BASE_PATH:-/}
    depends_on:
      - editor-backend
    develop:
      watch:
        - action: rebuild
          path: ./editor/frontend/src
        - action: rebuild
          path: ./editor/frontend/package.json
