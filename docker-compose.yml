services:
  nats:
    image: nats:2.10
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

  engine:
    image: ghcr.io/ardo314/ecs-engine/engine:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: engine/Dockerfile
    depends_on:
      - nats
    environment:
      NATS_URL: nats://nats:4222
    develop:
      watch:
        - action: rebuild
          path: ./engine/Engine

  movement-system:
    image: ghcr.io/ardo314/ecs-engine/movement-system:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: examples/MovementSystem/Dockerfile
    depends_on:
      - nats
      - engine
    environment:
      NATS_URL: nats://nats:4222
    develop:
      watch:
        - action: rebuild
          path: ./examples/MovementSystem

  editor:
    image: ghcr.io/ardo314/ecs-engine/editor:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: editor/Dockerfile
    depends_on:
      - nats
    ports:
      - "8080:8080"
    environment:
      NATS_URL: nats://nats:4222
      NATS_USER: ${NATS_USER:-}
      NATS_TOKEN: ${NATS_TOKEN:-}
      BASE_PATH: ${EDITOR_BASE_PATH:-/}
    develop:
      watch:
        - action: rebuild
          path: ./editor/src
        - action: rebuild
          path: ./editor/package.json
        - action: rebuild
          path: ./proto/gen/ts
